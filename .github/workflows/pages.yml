name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time, for the whole workflow, not only the deploy job: a run starts only after the
# previous run for main has built and deployed, and a newer queued run replaces an older pending one. So an
# older main run can never publish after a newer one. In-progress runs are not cancelled, so a deployment
# is never cut off halfway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  branch:
    runs-on: ubuntu-latest
    outputs:
      is-main: ${{ steps.check.outputs.is-main }}
    steps:
      # GitHub expression comparisons ignore case; Bash's comparison preserves it.
      - id: check
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            echo 'is-main=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is-main=false' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: branch
    if: needs.branch.outputs.is-main == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    # Only the exact main branch reaches this job, including for manual runs.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
